<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universal REST Endpoint Tester</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <h1>Endpoint Tester</h1>
    <div class="layout">
      <section class="request-panel" aria-labelledby="request-title">
        <h2 id="request-title">Request</h2>
        <form id="test-form">
          <label class="field" for="url">Endpoint URL
            <input id="url" type="url" placeholder="https://api.example.com/items" required>
          </label>
          <div class="row">
            <label class="field" for="method">HTTP Method
              <select id="method">
                <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
              </select>
            </label>
            <label class="field" for="status">Expected Status Code
              <input id="status" type="number" min="100" max="599" value="200" required>
            </label>
          </div>
          <label id="body-field" class="field" for="body">JSON Request Body <span class="optional">Optional</span>
            <textarea id="body" rows="6" spellcheck="false" placeholder="{&#10;  &quot;name&quot;: &quot;Example&quot;&#10;}"></textarea>
          </label>
          <label class="field" for="expected-response">Expected Response JSON <span class="optional">Optional</span>
            <textarea id="expected-response" rows="6" spellcheck="false" placeholder="{&#10;  &quot;id&quot;: 1&#10;}"></textarea>
          </label>
          <details class="auth-options">
            <summary>Headers &amp; Authentication</summary>
            <label class="field" for="token">Bearer Token
              <input type="password" id="token" autocomplete="off">
            </label>
            <div id="headers"></div>
            <button type="button" class="text-button" id="add-header">Add header</button>
          </details>
          <button class="run" type="submit">Run Test</button>
          <div id="form-error" role="alert"></div>
        </form>
      </section>
      <section class="response-panel" id="results" aria-labelledby="response-title" aria-live="polite">
        <h2 id="response-title">Response</h2>
        <p class="empty">Run a request to see its result.</p>
      </section>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
